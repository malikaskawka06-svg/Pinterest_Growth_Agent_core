name: Pinterest Growth Agent Daily Run

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f Pinterest_Growth_Agent_core/requirements.txt ]; then pip install -r Pinterest_Growth_Agent_core/requirements.txt; fi
          playwright install --with-deps chromium

      - name: Run Pinterest Agent
        env:
          PINTEREST_EMAIL: ${{ secrets.PINTEREST_EMAIL }}
          PINTEREST_PASSWORD: ${{ secrets.PINTEREST_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -f main.py ]; then
            python main.py
          elif [ -f Pinterest_Growth_Agent_core/main.py ]; then
            cd Pinterest_Growth_Agent_core
            python main.py
          else
            echo "Error: main.py not found!"
            exit 1
          fi
